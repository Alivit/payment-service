name: Payment Service CI Pipeline

on:
  push:
    branches:
      - "main"
      - "develop"
      - "feature/**"
  pull_request:
    branches:
      - "main"
      - "develop"
      - "feature/**"

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Check Code Formatting (Spotless)
        run: |
          chmod +x gradlew
          ./gradlew spotlessCheck --no-daemon

      - name: Build and Run All Tests (with Coverage)
        run: ./gradlew build jacocoTestReport --no-daemon

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{secrets.SONAR_PROJECT_KEY}}
        run: ./gradlew sonar --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image (Artifact Creation Check)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: payment-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max