services:
  keycloak-postgres:
    container_name: keycloak_postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_ROOT_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_ROOT_PASSWORD}
      AUTH_DB_USER: ${AUTH_DB_USERNAME}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTH_DB_SCHEMA: ${AUTH_DB_SCHEMA}
    volumes:
      - ../auth-service/docker-init/init-keycloak-user.sh:/docker-entrypoint-initdb.d/init-keycloak-user.sh
      - keycloak_pg_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${AUTH_DB_ROOT_USER}", "-d", "${AUTH_DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command: [ "postgres", "-c", "max_connections=100", "-c", "shared_buffers=256MB", "-c", "synchronous_commit=off", "-c", "work_mem=16MB" ]
    deploy:
      resources:
        limits:
          memory: 512M

  user-postgres:
    container_name: user-postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${USER_DB_ROOT_USER}
      POSTGRES_PASSWORD: ${USER_DB_ROOT_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
      USER_DB_USER: ${USER_DB_USERNAME}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      USER_DB_SCHEMA: ${USER_DB_SCHEMA}
    volumes:
      - ../user-service/docker-init/init-app-user.sh:/docker-entrypoint-initdb.d/init-app-user.sh
      - user_pg_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${USER_DB_ROOT_USER}", "-d", "${USER_DB_NAME}" ]
      interval: 5s
      timeout: 3s
      retries: 5
    command: [ "postgres", "-c", "max_connections=100", "-c", "shared_buffers=256MB", "-c", "synchronous_commit=off", "-c", "work_mem=16MB" ]
    deploy:
      resources:
        limits:
          memory: 512M

  order-postgres:
    image: postgres:18-alpine
    container_name: order-postgres
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME}
      POSTGRES_USER: ${ORDER_DB_ROOT_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_ROOT_PASSWORD}
      ORDER_DB_USER: ${ORDER_DB_USERNAME}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      ORDER_DB_SCHEMA: ${ORDER_DB_SCHEMA}
    volumes:
      - ../order-service/docker-init/init-order-user.sh:/docker-entrypoint-initdb.d/init-order-user.sh
      - order_pg_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${ORDER_DB_ROOT_USER}", "-d", "${ORDER_DB_NAME}" ]
      interval: 5s
      timeout: 3s
      retries: 5
    command: [ "postgres", "-c", "max_connections=100", "-c", "shared_buffers=256MB", "-c", "synchronous_commit=off", "-c", "work_mem=16MB" ]
    deploy:
      resources:
        limits:
          memory: 512M

  payment-mongodb:
    build:
      context: ./docker-init
      dockerfile: Dockerfile.mongo
    container_name: payment-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${PAYMENT_DB_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${PAYMENT_DB_ROOT_PASSWORD}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME}
      PAYMENT_DB_USERNAME: ${PAYMENT_DB_USERNAME}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
    volumes:
      - ./docker-init/init-payment-user.js:/docker-entrypoint-initdb.d/init-payment-user.js:ro
      - payment_mongo_data:/data/db
    command: mongod --replSet rs0 --keyFile /data/replica.key
    ports:
      - "${MONGO_PORT}:27017"
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet",
              "-u", "${PAYMENT_DB_ROOT_USER}",
              "-p","${PAYMENT_DB_ROOT_PASSWORD}",
              "--authenticationDatabase", "admin",
              "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

  mongo-init:
    image: mongo:${MONGO_VERSION}
    container_name: payment-mongodb-init
    depends_on:
      payment-mongodb:
        condition: service_healthy
    command: >
      mongosh --host payment-mongodb:${MONGO_PORT}
      -u ${PAYMENT_DB_ROOT_USER} -p ${PAYMENT_DB_ROOT_PASSWORD} 
      --authenticationDatabase admin 
      --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:"rs0", members:[{_id:0, host:"payment-mongodb:${MONGO_PORT}"}]}) }'

  redis:
    image: redis:7.4-alpine
    container_name: redis
    command: [ "redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru" ]
    deploy:
      resources:
        limits:
          memory: 384M

  payment-kafka:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: payment-kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://payment-kafka:29092,EXTERNAL://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@payment-kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - payment_kafka_data:/var/lib/kafka/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: keycloak
    entrypoint: [ "/bin/bash", "-c" ]
    command: >
      "/opt/keycloak/bin/kc.sh build --db=postgres && 
       /opt/keycloak/bin/kc.sh start --import-realm --optimized"
    env_file:
      - '.env'
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_postgres:5432/${AUTH_DB_NAME}?currentSchema=${AUTH_DB_SCHEMA}
      KC_DB_USERNAME: ${AUTH_DB_USERNAME}
      KC_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      KC_HTTPS_PORT: ${KC_HTTPS_PORT}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_TRANSACTION_XA_ENABLED: ${KC_TRANSACTION_XA_ENABLED}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT}
      KC_FEATURES: ${KC_FEATURES}
      KC_HTTPS_CERTIFICATE_FILE: ${KC_HTTPS_CERTIFICATE_FILE}
      KC_HTTPS_CERTIFICATE_KEY_FILE: ${KC_HTTPS_CERTIFICATE_KEY_FILE}
      KC_TRUSTSTORE_PATHS: ${KC_TRUSTSTORE_PATHS}
      KC_HTTPS_CLIENT_AUTH: request
      JAVA_OPTS_APPEND: "-Xms1024m -Xmx2048m -XX:MetaspaceSize=256M -XX:MaxMetaspaceSize=512M -Dkeycloak.migration.replace-placeholders=true"
    ports:
      - "${KC_HTTPS_PORT}:${KC_HTTPS_PORT}"
    volumes:
      - ../auth-service/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ../auth-service/certs/keycloak.crt:/opt/keycloak/conf/keycloak.crt:ro
      - ../auth-service/certs/keycloak.key:/opt/keycloak/conf/keycloak.key:ro
      - ../auth-service/certs/root-ca.crt:/opt/keycloak/conf/root-ca.crt:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/${KC_HTTPS_PORT} || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G

  auth-service:
    image: auth-service:latest
    container_name: auth-service
    build:
      context: ../auth-service
      dockerfile: Dockerfile
    env_file:
      - '.env'
    environment:
      SERVER_PORT: ${AUTH_SERVICE_PORT}
      GRPC_SERVER_PORT: ${AUTH_GRPC_SERVER_PORT}
    depends_on:
      keycloak:
        condition: service_started
    volumes:
      - ../auth-service/certs:/app/certs:ro
    deploy:
      resources:
        limits:
          memory: 512M

  user-service:
    image: user-service:latest
    container_name: user-service
    build:
      context: ../user-service
      dockerfile: Dockerfile
    env_file:
      - '.env'
    environment:
      SERVER_PORT: ${USER_SERVICE_PORT}
      GRPC_SERVER_PORT: ${USER_GRPC_SERVER_PORT}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      user-postgres:
        condition: service_healthy
      redis:
        condition: service_started
      auth-service:
        condition: service_started
    volumes:
      - ../auth-service/certs:/app/certs:ro
    deploy:
      resources:
        limits:
          memory: 512M

  order-service:
    image: order-service:latest
    container_name: order-service
    build:
      context: ../order-service
      dockerfile: Dockerfile
    env_file:
      - '.env'
    environment:
      SERVER_PORT: ${ORDER_SERVICE_PORT}
      GRPC_SERVER_PORT: ${ORDER_GRPC_SERVER_PORT}
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx160m
    depends_on:
      order-postgres:
        condition: service_healthy
      payment-kafka:
        condition: service_started
    volumes:
      - ../auth-service/certs:/app/certs:ro
    deploy:
      resources:
        limits:
          memory: 512M

  payment-service:
    build:
      context: .
    container_name: payment-service
    env_file:
      - '.env'
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "${PAYMENT_SERVICE_PORT}:${PAYMENT_SERVICE_PORT}"
    volumes:
      - ../auth-service/certs:/app/certs:ro
    depends_on:
      payment-mongodb:
        condition: service_healthy
      payment-kafka:
        condition: service_started

  api-gateway:
    image: api-gateway:latest
    container_name: api-gateway
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    ports:
      - "${GATEWAY_PORT}:8080"
    env_file:
      - '.env'
    environment:
      APP_CLIENT_ID: ${APP_CLIENT_ID}
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
    volumes:
      - ../auth-service/certs:/app/certs:ro
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  default:
    name: innowise-network

volumes:
  keycloak_pg_data:
  user_pg_data:
  order_pg_data:
  payment_mongo_data:
  payment_kafka_data: