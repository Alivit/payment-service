spring:
  application:
     name: payment-service
  threads:
    virtual:
      enabled: true
  mongodb:
    uri: mongodb://localhost:27017/payments_db
    representation:
      uuid: standard
logging:
  level:
    root: INFO
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
app:
  liquibase:
    enabled: true
    change-log: db/changelog/changelog.yml
    uri: mongodb://localhost:27017/payments_db