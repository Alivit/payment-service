databaseChangeLog:
  - changeSet:
      id: 2
      author: Chuiko Vitali
      changes:
        - createCollection:
            collectionName: outboxEvents
            validationAction: error
            validationLevel: strict
            validator: |-
              {
                $jsonSchema: {
                  bsonType: "object",
                  required: ["_id", "aggregateId", "eventType", "payload", "status", "createdAt"],
                  properties: {
                    _id: { 
                      bsonType: "binData"
                    },
                    aggregateId: { 
                      bsonType: "string"
                    },
                    eventType: { 
                      bsonType: "string"
                    },
                    payload: { 
                      bsonType: "object"
                    },
                    status: { 
                      enum: ["PENDING", "COMPLETED", "FAILED"]
                    },
                    createdAt: { 
                      bsonType: "date"
                    }
                  }
                }
              }
      rollback:
        - dropCollection:
            collectionName: outboxEvents