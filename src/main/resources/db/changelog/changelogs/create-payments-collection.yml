databaseChangeLog:
  - changeSet:
      id: 2
      author: Chuiko Vitali
      changes:
        - createCollection:
            collectionName: payments
            validationAction: error
            validationLevel: strict
            validator: |-
              {
                $jsonSchema: {
                  bsonType: "object",
                  required: ["order_id", "user_id", "status", "timestamp", "payment_amount"],
                  properties: {
                    order_id: { bsonType: "string", description: "Must be a string and is required" },
                    user_id: { bsonType: "string", description: "Must be a string and is required" },
                    status: { enum: ["PENDING", "SUCCESS", "FAILED", "REJECTED"], description: "Strict state loop" },
                    timestamp: { bsonType: "date", description: "Must be a date and is required" },
                    payment_amount: { bsonType: "decimal", description: "High-precision monetary decimal value" }
                  }
                }
              }