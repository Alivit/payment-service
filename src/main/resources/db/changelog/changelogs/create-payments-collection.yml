databaseChangeLog:
  - changeSet:
      id: 1
      author: Chuiko Vitali
      changes:
        - createCollection:
            collectionName: payments
            validationAction: error
            validationLevel: strict
            validator: |-
              {
                $jsonSchema: {
                  bsonType: "object",
                  required: ["_id", "orderId", "userId", "paymentStatus", "createdAt", "paymentAmount", "currency"],
                  properties: {
                    _id: { 
                      bsonType: "binData", 
                      description: "Primary key, must be a UUID" 
                    },
                    orderId: { 
                      bsonType: "binData", 
                      description: "Must be a UUID and is required" 
                    },
                    userId: { 
                      bsonType: "binData", 
                      description: "Must be a UUID and is required" 
                    },
                    paymentStatus: { 
                      enum: ["PENDING", "SUCCESS", "FAILED", "REJECTED"], 
                      description: "Strict state loop matching Java Enum" 
                    },
                    createdAt: { 
                      bsonType: "date"
                    },
                    updatedAt: {
                      bsonType: "date",
                      description: "Timestamp of the last status update"
                    },
                    paymentAmount: { 
                      bsonType: "decimal", 
                      description: "High-precision monetary decimal value" 
                    },
                    version: {
                      bsonType: "long"
                    },
                  }
                }
              }
      rollback:
        - dropCollection:
            collectionName: payments