databaseChangeLog:
  - changeSet:
      id: 1
      author: Chuiko Vitali
      changes:
        - createCollection:
            collectionName: payments
            validationAction: error
            validationLevel: strict
            validator: |-
              {
                $jsonSchema: {
                  bsonType: "object",
                  required: ["_id", "order_id", "user_id", "payment_status", "created_at", "payment_amount"],
                  properties: {
                    _id: { 
                      bsonType: "binData", 
                      description: "Primary key, must be a UUID" 
                    },
                    order_id: { 
                      bsonType: "binData", 
                      description: "Must be a UUID and is required" 
                    },
                    user_id: { 
                      bsonType: "binData", 
                      description: "Must be a UUID and is required" 
                    },
                    payment_status: { 
                      enum: ["PENDING", "SUCCESS", "FAILED", "REJECTED"], 
                      description: "Strict state loop matching Java Enum" 
                    },
                    created_at: { 
                      bsonType: "date"
                    },
                    payment_amount: { 
                      bsonType: "decimal", 
                      description: "High-precision monetary decimal value" 
                    }
                  }
                }
              }
      rollback:
        - dropCollection:
            collectionName: payments