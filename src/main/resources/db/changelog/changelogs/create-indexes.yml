databaseChangeLog:
  - changeSet:
      id: 3
      author: Chuiko Vitali
      changes:
        - createIndex:
            collectionName: payments
            keys: "{ order_id: 1, created_at: -1 }"
            options: "{ name: 'idx_payments_order_id_created_at' }"
      rollback:
        - dropIndex:
            collectionName: payments
            indexName: idx_payments_order_id_unique
  - changeSet:
      id: 4
      author: Chuiko Vitali
      changes:
        - createIndex:
            collectionName: payments
            keys: "{ user_id: 1, payment_status: 1, created_at: 1 }"
            options: "{ name: 'idx_payments_user_status_date' }"
      rollback:
        - dropIndex:
            collectionName: payments
            indexName: idx_payments_user_id_timestamp
  - changeSet:
      id: 5
      author: Chuiko Vitali
      changes:
        - createIndex:
            collectionName: payments
            keys: "{ payment_status: 1, created_at: 1 }"
            options: "{ name: 'idx_payments_status_date' }"
      rollback:
        - dropIndex:
            collectionName: payments
            indexName: idx_payments_timestamp
  - changeSet:
      id: 6
      author: Chuiko Vitali
      changes:
        - createIndex:
            collectionName: outbox_events
            keys: "{ status: 1, created_at: 1 }"
            options: "{ name: 'idx_outbox_status_date' }"
      rollback:
        - dropIndex:
            collectionName: outbox_events
            indexName: idx_outbox_status_date
  - changeSet:
      id: 7
      author: Chuiko Vitali
      changes:
        - createIndex:
            collectionName: outbox_events
            keys: "{ created_at: 1 }"
            options: >-
              { 
                name: 'ttl_idx_outbox_cleanup', 
                expireAfterSeconds: 259200, 
                partialFilterExpression: { status: 'COMPLETED' } 
              }
      rollback:
        - dropIndex:
            collectionName: outbox_events
            indexName: ttl_idx_outbox_cleanup



