databaseChangeLog:
  - changeSet:
      id: 3
      author: Chuiko Vitali
      changes:
        - createIndex:
            collectionName: payments
            keys: "{ orderId: 1 }"
            options: >-
              { 
                name: 'idx_payments_orderId_unique', 
                unique: true 
              }
      rollback:
        - dropIndex:
            collectionName: payments
            indexName: idx_payments_orderId_unique
  - changeSet:
      id: 4
      author: Chuiko Vitali
      changes:
        - createIndex:
            collectionName: payments
            keys: "{ userId: 1, paymentStatus: 1, createdAt: 1 }"
            options: "{ name: 'idx_payments_userId_status_date' }"
      rollback:
        - dropIndex:
            collectionName: payments
            indexName: idx_payments_userId_status_date
  - changeSet:
      id: 5
      author: Chuiko Vitali
      changes:
        - createIndex:
            collectionName: payments
            keys: "{ paymentStatus: 1, createdAt: 1 }"
            options: "{ name: 'idx_payments_status_date' }"
      rollback:
        - dropIndex:
            collectionName: payments
            indexName: idx_payments_status_date
  - changeSet:
      id: 6
      author: Chuiko Vitali
      changes:
        - createIndex:
            collectionName: outboxEvents
            keys: "{ status: 1, createdAt: 1 }"
            options: "{ name: 'idx_outboxEvents_status_date' }"
      rollback:
        - dropIndex:
            collectionName: outboxEvents
            indexName: idx_outboxEvents_status_date
  - changeSet:
      id: 7
      author: Chuiko Vitali
      changes:
        - createIndex:
            collectionName: outboxEvents
            keys: "{ createdAt: 1 }"
            options: >-
              { 
                name: 'ttl_idx_outboxEvents_cleanup', 
                expireAfterSeconds: 259200, 
                partialFilterExpression: { status: 'COMPLETED' } 
              }
      rollback:
        - dropIndex:
            collectionName: outboxEvents
            indexName: ttl_idx_outboxEvents_cleanup



